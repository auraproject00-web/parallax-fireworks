<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallax Nama + Fireworks + Sound</title>
  <style>
    /* Layout dasar */
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px circle at 50% 60%, #0b0f18 0%, #05070c 70%);
      overflow: hidden;
      touch-action: none; /* tap = kembang api, geser = parallax (tanpa scroll/zoom) */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e8f6ff;
    }

    /* Canvas fireworks di paling belakang */
    #fwCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Parallax container untuk nama */
    .parallax {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: grid;
      place-items: center;
      perspective: 800px;
    }

    /* Wrapper nama dengan sedikit glow */
    .name-wrap {
      position: relative;
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.03);
      box-shadow:
        0 0 40px rgba(0, 255, 255, 0.2),
        inset 0 0 20px rgba(255, 0, 255, 0.08);
      transform-style: preserve-3d;
    }

    /* Setiap huruf punya layer berbeda untuk parallax */
    .char {
      font-weight: 800;
      font-size: clamp(42px, 8vw, 120px);
      letter-spacing: 2px;
      display: inline-block;
      padding: 0 6px;
      color: #dff8ff;
      text-shadow:
        0 0 12px rgba(0,255,255,0.5),
        0 0 24px rgba(0,255,255,0.3),
        0 0 48px rgba(255,0,255,0.2);
      transition: transform 0.08s linear;
      will-change: transform;
    }

    /* Layer depth untuk efek parallax beda-beda */
    .char[data-depth="1"] { transform: translateZ(20px); }
    .char[data-depth="2"] { transform: translateZ(10px); }
    .char[data-depth="3"] { transform: translateZ(0px);  }
    .char[data-depth="4"] { transform: translateZ(-10px); }
    .char[data-depth="5"] { transform: translateZ(-20px); }

    /* Kontrol UI */
    .controls {
      position: fixed;
      z-index: 3;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 10px;
    }
    .btn {
      background: rgba(255,255,255,0.08);
      color: #cfe9ff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: transform 0.1s ease, background 0.2s ease;
      font-weight: 600;
    }
    .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); }
    .hint {
      position: fixed;
      z-index: 3;
      left: 16px;
      bottom: 16px;
      font-size: 13px;
      color: #9cc7ff;
      opacity: 0.8;
      user-select: none;
      pointer-events: none;
      max-width: calc(100% - 230px); /* jangan tabrak tombol di layar sempit */
    }
  </style>
</head>
<body>
  <canvas id="fwCanvas"></canvas>

  <!-- Parallax name -->
  <section class="parallax">
    <div class="name-wrap" id="nameWrap" aria-label="Nama Parallax">
      <!-- Ganti teks di sini -->
      <!-- Tips: pakai huruf kapital biar lebih tebal -->
      <span class="char" data-depth="1">H</span>
      <span class="char" data-depth="2">E</span>
      <span class="char" data-depth="3">N</span>
      <span class="char" data-depth="4">D</span>
      <span class="char" data-depth="5">R</span>
      <span class="char" data-depth="1">A</span>
      <span class="char" data-depth="2">W</span>
      <span class="char" data-depth="3">A</span>
      <span class="char" data-depth="4">N</span>
    </div>
  </section>

  <!-- Controls -->
  <div class="controls">
    <button id="fireBtn" class="btn">Kembang Api!</button>
    <button id="muteBtn" class="btn">Mute</button>
  </div>
  <div class="hint">Gerakkan mouse / geser jari / miringkan HP untuk parallax. Klik atau tap di mana saja untuk kembang api + sound.</div>

  <!-- Audio: pastikan file ada di path ini -->
  <!-- Ganti src ke file kamu sendiri, misal ./sounds/firework.mp3 -->
  <audio id="fwSound" preload="auto">
    <source src="./fireworks.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* ===== Parallax logic ===== */
    const nameWrap = document.getElementById('nameWrap');
    const chars = Array.from(document.querySelectorAll('.char'));

    // x, y dalam rentang -0.5 .. 0.5
    function applyParallax(x, y) {
      x = Math.max(-0.5, Math.min(0.5, x));
      y = Math.max(-0.5, Math.min(0.5, y));
      const cx = x * 20;  // intensitas rotasi X
      const cy = y * -20; // intensitas rotasi Y (balik biar natural)

      nameWrap.style.transform = `rotateY(${cx}deg) rotateX(${cy}deg)`;

      // sedikit offset per huruf tergantung depth
      chars.forEach((el) => {
        const d = parseInt(el.dataset.depth, 10) || 3;
        const ox = x * d * 4; // offset horizontal
        const oy = y * d * 4; // offset vertical
        el.style.transform = `translateZ(${(3 - d) * 8}px) translate(${ox}px, ${oy}px)`;
      });
    }

    function parallaxFromPoint(clientX, clientY) {
      const rect = nameWrap.getBoundingClientRect();
      applyParallax(
        (clientX - rect.left) / rect.width - 0.5,
        (clientY - rect.top) / rect.height - 0.5
      );
    }

    // Mouse + geser jari (pointermove juga jalan untuk touch)
    window.addEventListener('pointermove', (e) => parallaxFromPoint(e.clientX, e.clientY));

    // Kemiringan HP (device tilt)
    function onTilt(e) {
      if (e.gamma == null || e.beta == null) return;
      // gamma: kiri-kanan (-90..90), beta: depan-belakang (-180..180, ~45 saat HP dipegang)
      applyParallax(e.gamma / 60, (e.beta - 45) / 60);
    }
    function enableTilt() {
      if (typeof DeviceOrientationEvent === 'undefined') return;
      // iOS 13+ butuh izin dari gesture user
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then((state) => { if (state === 'granted') window.addEventListener('deviceorientation', onTilt); })
          .catch(() => {});
      } else {
        window.addEventListener('deviceorientation', onTilt);
      }
    }

    /* ===== Fireworks on canvas ===== */
    const canvas = document.getElementById('fwCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], rockets = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function hsvToRgb(h, s, v) { // h:0-360, s/v:0-1
      h = ((h % 360) + 360) % 360;
      let c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) [r,g,b] = [c,x,0];
      else if (h < 120) [r,g,b] = [x,c,0];
      else if (h < 180) [r,g,b] = [0,c,x];
      else if (h < 240) [r,g,b] = [0,x,c];
      else if (h < 300) [r,g,b] = [x,0,c];
      else [r,g,b] = [c,0,x];
      return `rgb(${Math.round((r+m)*255)},${Math.round((g+m)*255)},${Math.round((b+m)*255)})`;
    }

    // Roket naik dari bawah layar, meledak saat sampai di (x, y)
    function launchFirework(x, y) {
      rockets.push({
        x: x,
        y: H,
        targetY: y,
        vy: -Math.max(8, (H - y) / 45), // kecepatan naik (px per frame @60fps)
        trail: []
      });
    }

    function spawnFirework(x, y) {
      const hue = rand(0, 360);

      // bikin 4 batch ledakan bertahap
      for (let b = 0; b < 4; b++) {
        setTimeout(() => {
          const count = Math.floor(rand(25, 40));
          for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(2, 6);
            particles.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: rand(0.8, 1.6),
              age: 0,
              color: hsvToRgb(hue + rand(-20, 20), 1, 1)
            });
          }
        }, b * 200); // jeda antar batch
      }

      // tiap ledakan punya suara sendiri
      playSound();
    }

    function update(dt) {
      const gravity = 0.5;

      rockets = rockets.filter(r => {
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 8) r.trail.shift();
        r.y += r.vy * dt * 60;
        if (r.y <= r.targetY) {
          spawnFirework(r.x, r.targetY);
          return false;
        }
        return true;
      });

      particles = particles.filter(p => p.age < p.life);
      particles.forEach(p => {
        p.vy += gravity * dt;
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.age += dt;
      });
    }

    function draw() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(5,7,12,0.25)';
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = 'lighter';

      rockets.forEach(r => {
        r.trail.forEach((t, i) => {
          ctx.fillStyle = `rgba(255,220,180,${(i + 1) / r.trail.length * 0.6})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      particles.forEach(p => {
        const t = p.age / p.life;
        const size = Math.max(1, 4 - 3 * t);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Interaksi: klik/tap layar atau tombol
    const controls = document.querySelector('.controls');
    window.addEventListener('click', (e) => {
      // klik di tombol jangan ikut bikin kembang api di posisi kursor
      if (controls.contains(e.target)) return;
      launchFirework(e.clientX, e.clientY);
    });
    document.getElementById('fireBtn').addEventListener('click', () => {
      const x = rand(W * 0.2, W * 0.8);
      const y = rand(H * 0.2, H * 0.6);
      launchFirework(x, y);
    });

    /* ===== Sound control ===== */
    const audioSrc = document.querySelector('#fwSound source').getAttribute('src');
    const muteBtn = document.getElementById('muteBtn');
    let muted = false;

    // Pool audio: tiap ledakan pakai elemen sendiri, jadi suara tidak saling memotong
    const audioPool = Array.from({ length: 8 }, () => {
      const a = new Audio(audioSrc);
      a.preload = 'auto';
      return a;
    });
    let poolIndex = 0;

    function playSound() {
      if (muted) return;
      const a = audioPool[poolIndex];
      poolIndex = (poolIndex + 1) % audioPool.length;
      a.currentTime = 0;
      a.play().catch(err => {
        console.log("Audio gagal diputar:", err);
      });
    }

    muteBtn.addEventListener('click', () => {
      muted = !muted;
      muteBtn.textContent = muted ? 'Unmute' : 'Mute';
      if (muted) audioPool.forEach(a => a.pause());
    });

    // Gesture pertama: buka kunci audio (HP butuh ini) + minta izin tilt
    window.addEventListener('pointerdown', () => {
      audioPool.forEach(a => {
        a.muted = true;
        a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
          .catch(() => { a.muted = false; });
      });
      enableTilt();
    }, { once: true });
  </script>
</body>
</html>
